networks:
  monitoring:
    driver: bridge
  reverse-proxy-network:
    external: true
volumes:
  prometheus_data: {}
  grafana_storage: {}
  tempo_data: {}
services:
  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node-exporter/textfile:/etc/node-exporter/textfile
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/etc/node-exporter/textfile"
    expose:
      - 9100
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    labels:
      traefik.enable: true
      # increase readingTimeouts for the entrypoint used here
      traefik.http.routers.prometheus.entrypoints: websecure
      traefik.http.routers.prometheus.rule: Host(`prometheus.oscarcorner.com`)
      traefik.http.services.prometheus.loadbalancer.server.port: 9090
      traefik.http.routers.prometheus.tls.certresolver: route53
      traefik.docker.network: reverse-proxy-network

    expose:
      - 9090
    networks:
      - monitoring
      - reverse-proxy-network
  cadvisor:
    container_name: cadvisor
    image: ghcr.io/google/cadvisor:v0.60.3@sha256:c4c44a8d178a1f3985d4aec9f0876a313cc7833ee07fe1d0d8ec63707ef7d69f
    command:
      - "-housekeeping_interval=10s"
      - "-docker_only=true"
      - "store_container_labels=false"
    volumes:
      - "/:/rootfs"
      - "/var/run:/var/run"
      - "/sys:/sys"
      - "/var/lib/docker/:/var/lib/docker"
      - "/dev/disk/:/dev/disk"
    privileged: true
    networks:
      - monitoring
    devices:
      - "/dev/kmsg"
  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.oscarcorner.com/
    labels:
      traefik.enable: true
      # increase readingTimeouts for the entrypoint used here
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.rule: Host(`grafana.oscarcorner.com`)
      traefik.http.services.grafana.loadbalancer.server.port: 3000
      traefik.http.routers.grafana.tls.certresolver: route53
      traefik.docker.network: reverse-proxy-network
    volumes:
      - "grafana_storage:/var/lib/grafana"
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    networks:
      - monitoring
      - reverse-proxy-network
  tempo:
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    container_name: tempo
    command: -config.file=/etc/tempo/tempo.yaml
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "4317:4317/tcp" # OTLP gRPC
      - "4318:4318/tcp" # OTLP HTTP
    expose:
      - 3200
    networks:
      - monitoring
  # dcgm-exporter:
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities:
  #               - gpu
  #   cap_add:
  #     - SYS_ADMIN
  #   ports:
  #     - 9400:9400
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-distroless@sha256:ed594cf53fe6942e84b07b0740cdcbb249fa4b39cb21feeebf93881ae51f0b5e
  #   networks:
  #     - monitoring
  nut-exporter:
    # Stable v1
    image: hon95/prometheus-nut-exporter:1@sha256:a9bfbbae3b12a6486e6e4b933a69a79d01342db27346d6b4cd5512f4eef6b111
    environment:
      - TZ=Europe/London
      - HTTP_PATH=/metrics
      # Defaults
      #- RUST_LOG=info
      #- HTTP_PORT=9995
      #- HTTP_PATH=/nut
      #- LOG_REQUESTS_CONSOLE=false
      #- PRINT_METRICS_AND_EXIT=false
    ports:
      - "9995:9995/tcp"
    networks:
      - monitoring
  vector:
    image: timberio/vector:0.54.X-debian@sha256:7311e050492a452b762d82488b0dd26312c3099b7274e4300c6c01b6e9f9c6d9
    container_name: vector
    command: --config /etc/vector/vector.toml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "514:514/udp"
    restart: unless-stopped
    networks:
      - monitoring
  loki:
    image: grafana/loki:3.7.3@sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - monitoring
  graphite-exporter:
    image: ghcr.io/supporterino/truenas-graphite-to-prometheus:v2.2.1@sha256:60e7645f74a3243d7fb9e6a15c05ea3b4cddfd2bc7ba9e2b11321ce1d38286dd
    container_name: graphite-exporter
    restart: unless-stopped
    ports:
      - "9109:9109/tcp" # Graphite input (plaintext)
      - "9109:9109/udp" # Graphite input (UDP)
      - "9108:9108/tcp" # Prometheus metrics output
    networks:
      - monitoring
