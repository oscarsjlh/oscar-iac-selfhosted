name: paperless

services:
  webserver:
    container_name: paperless_webserver
    # Leave CPU and RAM available for the host, including during OCR.
    cpus: 2.0
    mem_limit: 1536m
    # Equal memory and memory+swap limits disable container swap.
    memswap_limit: 1536m
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS:?Set in .env}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set in .env}
      # Web/CSRF config for the Traefik HTTPS frontend
      PAPERLESS_URL: https://paperless.oscarcorner.com
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.oscarcorner.com
      # Tika + Gotenberg enable Office document support (.docx, .odt, .xlsx, ...)
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    networks:
      - reverse-proxy-network
    labels:
      traefik.enable: true
      traefik.http.routers.paperless.entrypoints: websecure
      traefik.http.routers.paperless.rule: Host(`paperless.oscarcorner.com`)
      traefik.http.services.paperless.loadbalancer.server.port: 8000
      traefik.http.routers.paperless.tls.certresolver: route53

  broker:
    container_name: paperless_broker
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    image: docker.io/library/redis:8@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    restart: unless-stopped
    volumes:
      - ./redisdata:/data
    networks:
      - reverse-proxy-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    container_name: paperless_db
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    image: docker.io/library/postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?Set in .env}
    networks:
      - reverse-proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 30s
      timeout: 5s
      retries: 5

  gotenberg:
    container_name: paperless_gotenberg
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    image: docker.io/gotenberg/gotenberg:8@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    restart: unless-stopped
    # The official Paperless-ngx image expects these chromium flags
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - reverse-proxy-network

  tika:
    container_name: paperless_tika
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    # NOTE: pinned to 3.x — Paperless-ngx does not yet support Tika 4
    # (this is the same version paperless-ngx pins in their official compose).
    # Do not merge a Renovate PR bumping this to 4.x until paperless adds support.
    image: docker.io/apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
    restart: unless-stopped
    networks:
      - reverse-proxy-network

networks:
  reverse-proxy-network:
    external: true
